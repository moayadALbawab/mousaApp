
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحتي الجميلة</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .card {
            background-color: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            width: 300px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 15px;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin: 20px 0 10px;
        }

        p {
            color: #777;
            font-size: 15px;
            line-height: 1.6;
        }

        button {
            background-color: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #4c5fd5;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="card">
        <img src="mm.jpg" alt="صورة جميلة">

        <h1>أهلاً بك!</h1>

        <p>مرحباً بك في صفحتي الأولى بتصميم جميل وبسيط.</p>

        <button onclick="alert('أهلاً وسهلاً بك!')">
            انقر هنا
        </button>
    </div>

</body>
</html>
